name: Release

# Push a version tag (e.g. v1.0.0) to publish the same artifact the local runbook
# does: scripts/release.sh with PUBLISH=1 runs the full gate (make ci), builds a
# universal, Developer ID-signed, notarized, stapled Pathem.app, wraps it in the
# DMG the README and RELEASE.md promise, signs it for Sparkle, verifies every
# artifact (scripts/verify-release.sh), and only then creates the GitHub Release
# with the DMG and appcast. Criteria: docs/PUBLISH_GATE_TESTING.md.
#
# The tag must equal the committed CFBundleShortVersionString; bump the version
# and CFBundleVersion in Packaging/Info.plist, commit, then tag that commit.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   DEVELOPER_ID_CERT_P12       base64 of your "Developer ID Application" .p12
#   DEVELOPER_ID_CERT_PASSWORD  the .p12 export password
#   DEVELOPER_ID                "Developer ID Application: Name (TEAMID)"
#   NOTARY_APPLE_ID             your Apple ID email
#   NOTARY_TEAM_ID              your 10-char team id
#   NOTARY_PASSWORD             an app-specific password (appleid.apple.com)
#   SPARKLE_PRIVATE_KEY         the EdDSA private key from Sparkle's generate_keys
#                               (export with: generate_keys -x private.key, then
#                               paste the file's contents). The matching public
#                               key goes in Packaging/Info.plist as SUPublicEDKey.
#
# Needs a paid Apple Developer account. A missing secret, a placeholder public key,
# a failing gate or an artifact that fails verification stops the job before upload.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Require the tag to match the committed version
        run: |
          set -euo pipefail
          # The publish preflight checks HEAD against the local tag ref.
          git fetch --depth=1 origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Packaging/Info.plist)"
          if [ "${GITHUB_REF_NAME#v}" != "$PLIST_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match CFBundleShortVersionString ${PLIST_VERSION}; bump and commit Packaging/Info.plist, then tag that commit"
            exit 1
          fi

      - name: Import Developer ID certificate
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Store notary credentials
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials pathem-notary \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD"

      - name: Gate, build, verify and publish (scripts/release.sh)
        env:
          PUBLISH: "1"
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
          NOTARY_PROFILE: pathem-notary
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::the SPARKLE_PRIVATE_KEY secret is missing"
            exit 1
          fi
          umask 077
          export SPARKLE_KEY_FILE="$RUNNER_TEMP/sparkle_ed_priv"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$SPARKLE_KEY_FILE"
          unset SPARKLE_PRIVATE_KEY
          trap 'rm -f "$SPARKLE_KEY_FILE"' EXIT
          scripts/release.sh
