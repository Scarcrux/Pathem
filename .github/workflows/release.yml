name: Release

# Push a version tag (e.g. v1.0.0) to build a universal, Developer ID-signed,
# notarized, stapled Pathem.app, generate a signed Sparkle appcast, and attach
# both to a GitHub Release. Existing installs then auto-update via Sparkle, and
# the build-from-source path in the README still works.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   DEVELOPER_ID_CERT_P12       base64 of your "Developer ID Application" .p12
#   DEVELOPER_ID_CERT_PASSWORD  the .p12 export password
#   DEVELOPER_ID                "Developer ID Application: Name (TEAMID)"
#   NOTARY_APPLE_ID             your Apple ID email
#   NOTARY_TEAM_ID              your 10-char team id
#   NOTARY_PASSWORD             an app-specific password (appleid.apple.com)
#   SPARKLE_PRIVATE_KEY         the EdDSA private key from Sparkle's generate_keys
#                               (export with: generate_keys -x private.key, then
#                               paste the file's contents). The matching public
#                               key goes in Packaging/Info.plist as SUPublicEDKey.
#
# Needs a paid Apple Developer account. Without the secrets the job fails fast.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # CFBundleVersion drives Sparkle's "is this newer?" check, so derive a
          # monotonic integer from the semver tag (not github.run_number, which
          # isn't ordered by tag). Each component must stay under 1000.
          IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
          BUILD=$(( ${MAJOR:-0} * 1000000 + ${MINOR:-0} * 1000 + ${PATCH:-0} ))
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Packaging/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" Packaging/Info.plist

      - name: Import Developer ID certificate
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Store notary credentials
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials pathem-notary \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD"

      - name: Build, sign, notarize, staple
        env:
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
          NOTARY_PROFILE: pathem-notary
        run: |
          set -euo pipefail
          scripts/package.sh   # DEVELOPER_ID set -> universal + Hardened Runtime + notarize + staple

      - name: Package + signed appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ditto -c -k --keepParent .build/Pathem.app "dist/Pathem-${GITHUB_REF_NAME}-universal.zip"
          GENERATE_APPCAST="$(find .build/artifacts -name generate_appcast -type f | head -1)"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_ed_priv"
          "$GENERATE_APPCAST" --ed-key-file "$RUNNER_TEMP/sparkle_ed_priv" \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
            dist
          rm -f "$RUNNER_TEMP/sparkle_ed_priv"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            "dist/Pathem-${GITHUB_REF_NAME}-universal.zip" \
            dist/appcast.xml \
            --title "Pathem ${GITHUB_REF_NAME}" \
            --generate-notes
