name: CI

# PR + manual ONLY -- no per-push runs (owner decision 2026-09-12, quota).
# The per-push macOS runs, even path-filtered + cancel-in-progress, billed at
# 10x and were ~70% of the account's 3,000 monthly Actions minutes (~198 raw
# macOS min = ~1,980 billable in Sep alone). `make ci` runs the SAME checks
# locally and is the enforcement for main (the Commandem CI posture); this
# workflow stays as the on-demand "Run workflow" button + the PR trust gate.
# Re-add a push trigger only if a green-main badge ever becomes worth 10x.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Localization coverage + plist validity (plutil is macOS-only, so this runs here
      # rather than on a cheaper runner). A missing/stale translation or a malformed
      # .strings fails the build.
      - name: Localization lint
        run: python3 scripts/l10n_lint.py

      - name: Build
        run: swift build --build-system native

      - name: Engine tests
        run: |
          # Serial (--no-parallel) so a test that blocks on an absent CI service names itself:
          # the last "started" without a matching "passed" is the culprit. macOS has no GNU
          # `timeout`, so a background watchdog bounds the run (12 min is ~40x the ~17s local
          # run) and kills the test process tree so a hang fails fast instead of burning the job.
          log="$RUNNER_TEMP/swift-test.log"
          swift test --build-system native --no-parallel > "$log" 2>&1 &
          pid=$!
          ( sleep 720; echo "WATCHDOG: killing hung swift test" >> "$log"; \
            kill -9 "$pid" 2>/dev/null; pkill -9 -P "$pid" 2>/dev/null; \
            pkill -9 xctest 2>/dev/null; pkill -9 -f PathemPackageTests 2>/dev/null ) &
          wd=$!
          wait "$pid"; rc=$?
          kill "$wd" 2>/dev/null || true
          tail -30 "$log"
          if [ "$rc" != "0" ]; then
            echo "::error::swift test failed or was killed (rc=$rc)"
            echo "---- last test events ----"
            grep -E "started|passed|failed|error:" "$log" | tail -12
            exit 1
          fi

      # The product-level suite launches a real debug app for Gate A, layout smoke, localization,
      # real-file create/rename, the daemon .torrent + magnet control seam, and the 39-check
      # on-screen interaction harness. Each process is timeout-bounded and reports its own result.
      - name: Product end-to-end
        run: test/e2e/run.sh

      - name: Release package end-to-end
        run: test/e2e/run.sh --packaged
