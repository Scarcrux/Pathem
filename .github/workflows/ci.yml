name: CI

# Runs automatically on code changes so regressions are caught without anyone
# remembering `make ci`. Minute-conscious for a private repo where macOS runners
# bill at 10x: it triggers only when code (Sources/Tests/Package) changes -- doc,
# site, and roadmap (commandem.toml) commits skip it -- and rapid pushes cancel
# earlier runs. Runs the l10n lint, build, engine tests, Gate A, and the UI smoke.
# `make ci` still runs the same checks locally; Run workflow triggers on demand.
on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Package.resolved"
      - "scripts/l10n_lint.py"
      - ".github/workflows/ci.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Pathem depends on the private Scarcrux/AppRelaunch package (the shared stale-build
      # watcher). The default GITHUB_TOKEN is scoped to THIS repo only and can't clone another
      # private repo, so SwiftPM's fetch needs an explicit read token. APPRELAUNCH_TOKEN is a
      # repo secret: a fine-grained PAT with Contents: read on Scarcrux/AppRelaunch (or a classic
      # PAT with `repo`). The url.insteadOf rewrite makes every github.com HTTPS clone -- here,
      # the `swift build` dependency fetch -- carry it. Drop this step if AppRelaunch goes public.
      - name: Authenticate SwiftPM to private package deps
        run: |
          git config --global \
            url."https://x-access-token:${{ secrets.APPRELAUNCH_TOKEN }}@github.com/".insteadOf \
            "https://github.com/"

      # Localization coverage + plist validity (plutil is macOS-only, so this runs here
      # rather than on a cheaper runner). A missing/stale translation or a malformed
      # .strings fails the build.
      - name: Localization lint
        run: python3 scripts/l10n_lint.py

      - name: Build
        run: swift build

      - name: Engine tests
        run: swift test

      # Gate A proves the table virtualizes a 1M-row dataset; the smoke test asserts
      # the window/pane layout invariants (the structural GUI bugs the unit tests can't
      # see). Both boot a real window, so they need the runner's GUI session, which the
      # macOS runners provide.
      - name: Gate A (virtualization proof)
        run: PATHEM_GATE_A=1 swift run Pathem

      - name: UI smoke (layout invariants)
        run: PATHEM_SMOKE=1 swift run Pathem
