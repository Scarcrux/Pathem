# One-time: `pre-commit install` (the hooks use Xcode's bundled Swift tools).
# CONVENTIONS: format on commit; tests via the hook + `make test`'s build system.
repos:
  - repo: local
    hooks:
      - id: swift-format
        name: swift-format
        entry: xcrun --toolchain XcodeDefault swift-format format --in-place --configuration .swift-format
        language: system
        files: \.swift$
      - id: gesture-support-pin
        name: shared gesture package pin
        entry: python3 vendor/GestureSupport/verify.py
        language: system
        pass_filenames: false
        files: ^vendor/GestureSupport/
      - id: swift-test
        name: swift test
        entry: bash -c 'unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_OBJECT_DIRECTORY GIT_COMMON_DIR GIT_PREFIX; exec xcrun --toolchain XcodeDefault swift test --build-system native'
        language: system
        pass_filenames: false
        files: \.swift$
      - id: l10n-lint
        name: localization coverage + plutil lint
        entry: python3 scripts/l10n_lint.py
        language: system
        pass_filenames: false
        files: \.(swift|strings)$
