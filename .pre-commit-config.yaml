# One-time: `brew install swift-format` then `pre-commit install`.
# CONVENTIONS: format on commit; tests via the hook + `swift test`.
repos:
  - repo: local
    hooks:
      - id: swift-format
        name: swift-format
        entry: swift-format format --in-place
        language: system
        files: \.swift$
      - id: swift-test
        name: swift test
        entry: swift test
        language: system
        pass_filenames: false
        files: \.swift$
      - id: l10n-lint
        name: localization coverage + plutil lint
        entry: python3 scripts/l10n_lint.py
        language: system
        pass_filenames: false
        files: \.(swift|strings)$