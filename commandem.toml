[[mission]]
  id = "m-253341c9"
  title = "Make the packaged window probe permissionless and mandatory"
  status = "done"
  note = "Trigger: the user granted/re-added Commandem UI-control permission twice, but the release window assertion still skipped. Evidence: tccd attributed the request to Commandem while rejecting it because the rebuilt ad-hoc host's current cdhash differed from the stored requirement; the same packaged Pathem process was independently visible through CGWindowListCopyWindowInfo. Mechanism: System Events required Accessibility to perform a read-only observation, coupling a deterministic package gate to an unstable host permission identity. Change: replaced AppleScript/System Events with a small external Core Graphics owner-PID/layer-0 probe; missing/unobservable windows now fail rather than skip; updated the test matrix and E2E documentation. Effect: make e2e-app passes 9/9 with one visible release window and zero skips; a clean full make ci passes localization/build, 9 XCTest + 746 Swift Testing tests in 156 suites, debug E2E 17/17, and packaged E2E 9/9. One preceding full run hit hdiutil Resource busy in encrypted-image creation; the isolated archive scenario then passed 10/10 and the clean full rerun passed, so it is recorded as transient device contention rather than hidden. Confidence: release liveness and visible-window presence are externally proven without Accessibility; this is not a full VoiceOver/assistive-technology audit."
