[[mission]]
  id = "m-fe4a359b"
  title = "Live-app fix: concurrent semantic-search crash"
  status = "done"
  note = "Trigger: searching for a file crashed Pathem and the user submitted the Apple crash report. Evidence: the 2026-09-28 20:00 crash report shows EXC_BAD_ACCESS inside BNNSFilterApplyBatch/NLEmbedding.vector(for:), while a second live worker was simultaneously in the same call path through NLEmbedder.shared. Mechanism: the process-wide NLEmbedding was declared nonisolated(unsafe) under an undocumented thread-safety assumption, allowing overlapping NaturalLanguage/CoreNLP inference. Change: all dimension/vector access now shares one locked reference state; removed the unsafe global assertion; added a deterministic 32-way concurrent regression with an overlap-detecting backend. Effect: focused regression passed 25/25 stress repetitions; make ci passed 748 Swift Testing cases plus 9 XCTest cases, debug E2E 17/17, and packaged E2E 9/9. Confidence: the concurrent call signature is directly observed in the crash and the synchronization invariant is deterministically tested; reproducing the original probabilistic framework SIGSEGV itself is neither required nor safe."
