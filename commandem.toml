[[mission]]
  id = "m-b4ebb9d9"
  title = "Folder sizes: cancellable walk, bounded threads, exclude list"
  status = "now"
  note = "Trigger: 2026-11-13, Finder sat at about 119% CPU because \"Calculate all sizes\" was on by default and it kept walking ~/Library (Go build cache, simulator devices); owner asked whether Pathem has the same problem. Evidence (code read, not run): FileListController.refreshFolderSizesAsync checks its generation only between folders, so DirectorySize.total cannot be cancelled mid-walk; each walk uses concurrentPerform over every core and up to 6 folders are walked at once; there is no exclude list. What already holds: the option is off by default and sizes are cached on disk by folder mtime. Change: (1) a cancel flag checked per directory inside ParallelWalk, honoured on navigate-away and on switching the option off; (2) one shared cap on total walker threads across folders, at utility QoS; (3) an exclude list in Settings (paths and name patterns such as ~/Library/Caches and node_modules) whose folders show a dash with a tooltip saying why. Tests seen red first for each; measure CPU and time on a large tree before and after. Confidence: mechanisms read from source, effect unmeasured."
  issue = 0
  estimate = "M"

  [[mission.comment]]
    text = "Owner 2026-11-13: \"pathem can identify the temp and cache directories\". Confirmed in source: Cleanup already classifies them (StorageScan.junkDirectories, excludedDirectories and cacheDirectories in Sources/PathemEngine/StorageScan.swift:10-28; ReclaimCatalog.cacheRoots at ReclaimCatalog.swift:100; RepoScan.regenerableNames at RepoScan.swift:19). So change (3) is not a hand-typed list: the folder-size walk reuses these classifiers. Default: cache, temp and regenerable folders are recognised and not walked automatically; the row shows a dash with a reason and a \"Calculate size\" action for that one folder, so the size is still one click away. Settings offers \"Skip caches and temporary folders when calculating sizes\" (default on) plus user-added paths. Add the system temp roots (the per-user TMPDIR under /var/folders, /tmp, /private/tmp) to the shared classifier if they are missing, in one place used by both Cleanup and sizes."
    at = "2026-11-13T10:48:17Z"

  [[mission.comment]]
    text = "293be43 implements all three parts. (1) DirectorySize.total(of:isCancelled:) stops part-way; file list and Reclaim Space pass their generation. (2) One process-wide walker pool, half the cores. (3) FolderSizeSkip (StorageScan + ReclaimCatalog lists + temp roots): skipped rows show a dash with a reason and a Calculate Size context action; Settings has the skip toggle and an Also skip list. Each has a test with a control. Measured, six real folders at once (744 GB, noisy machine): capped 273/282 s CPU vs 368/410 s uncapped, same wall time (about 68 to 87 s). Not done: a folder that only contains a cache (~/Library, a project with node_modules) is still walked in full. Unverified live: context menu item, Settings rows. Process note: an over-broad formatter run swept 103 unrelated files into the first local commit; rebuilt before landing."
    at = "2026-11-13T13:09:05Z"

  [[mission.comment]]
    text = "Scripted checks added for the two parts previously marked unverified: the context menu offers Calculate Size for a skipped folder and hides it after sizing (smoke); the real Settings checkbox and Also skip field deliver to the lists (settings harness 61/61). Remaining gap is visual only. Installed build 0fb5e21 already contains the feature; these checks are DEBUG-only."
    at = "2026-11-13T14:06:55Z"

