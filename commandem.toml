# commandem project manifest - see SPEC.md for the full contract.
# Committed at the project root; this is the authoritative
# self-description. Re-run `commandem add .` after editing.

name = "pathem"
working_dir = "."
# icon_emoji = "🛰️"

# --- Mode A: periodic checks -------------------------------------
# Provide check_command to run a health check on an interval. It must
# print a JSON array [{ "name": str, "ok": bool, "msg": str }] and
# exit 0 iff every check passed (non-JSON output falls back to one
# synthesized result keyed on exit code). See SPEC.md "Check output".
# check_command = "./scripts/commandem_check.sh"
# check_interval_minutes = 15

# --- Mode B: long-running job ------------------------------------
# Provide process_pattern to track a long-running job by pgrep. Add
# log_glob (relative to working_dir) to surface the latest log;
# completion_marker marks "done"; progress_regex needs exactly one
# capture group around the progress count.
# process_pattern = "train.py"
# log_glob = "results/*.log"
# completion_marker = "RECOMMENDATION"
# progress_regex = "window (\\d+) done"
# progress_total = 140
# queue_file = "results/queue.txt"

# >>> commandem roadmap (managed: edit phases in the Commandem app or `commandem roadmap`) >>>
[[milestone]]
  title = "Launch public and convert visitors into GitHub stars"
  why = "The repo exists to earn stars that back a job search, so the finish line is a public launch that converts, not just working code. Done when the repo is public, pathem.app converts (a working notarized download plus Sparkle auto-update, not a greyed 'coming soon'), and the README and site are HN-ready. Fed by the website, launch-conversion, update-affordance, and public-flip phases."
  status = "next"

[[milestone]]
  title = "Make the million-row claim real and verifiable in the open"
  why = "Pathem's signature differentiator, and the top HN lever per DESIGN.md, is that it stays fast at 1,000,000 rows because only visible rows are built. Done when make gate-a reproduces the benchmark on any machine and a scroll demo sits above the fold on the site and README, so a skeptic can verify the headline claim instead of taking it on faith."
  status = "next"

[[milestone]]
  title = "A power-user Finder replacement people trust and switch to"
  why = "Adoption (and stars) require parity-plus with Directory Opus, Path Finder, and ForkLift on a non-sandboxed build users trust with Full Disk Access. Done when the signature power features are complete, editor and Finder handoff ship, and the app stays hardened: tested dangerous corners, secure defaults, accessibility, localization, and no live-app rough edges."
  status = "now"

