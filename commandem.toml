[[mission]]
  id = "m-b619f6dc"
  title = "Audit fix: flaky MSE test was a real decryption bug (undecrypted post-handshake leftovers)"
  status = "done"
  note = "Pre-release audit ran the suite in a loop: encryptedHandshakeAndMessageOverRealSocket failed 3/6 runs with handshakeMismatch. Convicted, not a test problem: MSEHandshake.Stream buffers raw socket bytes; bytes TCP coalesced past the handshake end came back via drainBuffer() as CIPHERTEXT and were appended to inbound undecrypted (only receiveRawChunk decrypts). recv's RC4 keystream sits exactly at the first post-handshake byte, so the peer's BT handshake parsed as garbage whenever coalescing happened -> timing-dependent flake, and a real-world bug for any encrypted peer whose handshake reply coalesces. Fix: decrypt the drained leftover through recvCipher at both call sites (initiator connect + responder acceptEncryptedHandshake). Evidence: 0/15 failures after (was 3/6; P~3e-5 if unchanged), 740 tests + smoke pass."
  campaign = "A power-user Finder replacement people trust and switch to"
  issue = 0

