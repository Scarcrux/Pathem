    text = "Transient-surface audit 2026-10-03: underlying replace/keep-both/skip operations are unit- and product-tested, but PATHEM_FILES_E2E supplies a resolution and bypasses CursorConfirm. PATHEM_CONFLICT_SHOT is not invoked by test/e2e/run.sh and debugRender captures only a fabricated content view, excluding the actual NSPopover bubble, pointer anchoring, screen-edge placement, focus, dismissal and repeated-presentation lifecycle. The file-on-file Move Here/Copy Here/New Folder/Create Archive/Replace NSMenu has no automated rendering or invocation test. The micro-drag regression checks only a pure 5pt-versus-40pt threshold helper, not a real AppKit drag/drop event or menu nonappearance. Therefore green conflict behavior does not substantiate glitch-free UI."
