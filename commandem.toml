  [[mission.comment]]
    text = "Search audit 2026-10-08 triggered by user reporting bad/unintuitive file search. Evidence: targeted local search tests pass 18/18 across 5 suites, but runSearchMetadata exercises ContentSearch directly and UI automation only checks search-toolbar positioning; no query-to-result-to-open/reveal UI scenario exists. Default toolbar/Cmd-F opens CommandPalette semantic mode: its table contains one Search for query row, while SemanticSearcher.rank returns all indexed items ordered by cosine similarity with no relevance cutoff or filename-priority contract. Indexing covers only direct children, excludes hidden files and caps at 5000 without visible truncation/loading/model-unavailable reporting. Column/remote/smart views reject search with a beep. Filename substring search is separate in GlobalSearchController with scopes, a 200-result limit, and no explicit loading or surfaced Spotlight failure. Mechanism: semantic reranking is presented as ordinary file search and engine-level coverage has been mistaken for interaction coverage. Proven by code inspection and the local engine run; exact user-visible failure has not been reproduced in this audit. Recommendation: predictable filename-first UI with explicit other modes, followed by deterministic real-window positive/negative fixtures and lifecycle regressions. No search implementation changes made."
    at = "2026-10-08T15:39:02Z"

