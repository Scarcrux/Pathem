[[phase]]
  title = "Live-app: relaunch button verified; consider a prominent banner"
  status = "done"
  note = "Root cause: the title-bar UpdateButtonAccessory rendered inconsistently next to the unified toolbar - the watcher fired and isHidden=false (a false-positive smoke pass at fitting 147x20) yet nothing showed on the real window ('still nothing' after a manual trigger). Fix: RelaunchBanner, a full-width accent bar at the top of the browser content, driven by the same .pathemUpdateStateChanged state (Sparkle pending -> install; newer installed build -> relaunch). Smoke now asserts real size for both affordances (banner 547x36). Verified live: mtime-bumped exe, watcher fired ~26s, banner shown (user-confirmed). Commit 52a6614."
  milestone = "Launch public and convert visitors into GitHub stars"
  issue = 0

[[phase]]
  title = "Live-app fix: eject off the main thread (UI froze ~15s)"
  status = "done"
  note = "Eject ran unmountAndEjectDevice synchronously on the main thread, beachballing the app until the unmount finished. Now off-main with a status; UI stays responsive."
  milestone = "A power-user Finder replacement people trust and switch to"
  issue = 0

[[phase]]
  title = "Live-app fix: accidental micro-drag popped the Move Here menu"
  status = "done"
  note = "User report: 'asked to move files one at a time when I'm not trying to move.' Convicted (user-confirmed): a click with trackpad jitter starts a tiny NSTableView drag that lands on a neighbor and fired the drop-onto-file menu. Fix: a drop must travel >12pt from where the drag began to count as a move; cross-pane/app drops (no local start) unaffected. Only the list view calls onDropOntoFile. Smoke micro-drag-ignored; commit 3371919."
  milestone = "A power-user Finder replacement people trust and switch to"
  issue = 0
