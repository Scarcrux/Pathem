[[mission]]
  id = "m-f92102c1"
  title = "Live-app fix: opened file stays visible after watcher re-sort"
  status = "done"
  note = "Completed 2026-09-28. Trigger: the user repeatedly reported that after opening a file, Pathem changed the viewport until that file was no longer visible. Evidence: a deterministic UI scenario selected the oldest visible file at row 0, changed its modification date as an external editor can, refreshed through the watcher path, and observed it re-sort to row 39 outside the unchanged viewport; with the fix removed, the suite failed exactly this check at 48/49. Mechanism: setEntries preserved selection by name and restored the old clip origin, but did not reconcile a visible selected item moving to a new sorted row. Change: capture a selected row only when it is visible before refresh, restore state, then minimally reveal its new row; an intentionally off-screen selection is not pulled back. Effect: the focused scenario passes 49/49; make ci passes localization, build, 9 XCTest plus 748 Swift Testing cases, debug E2E 17/17 including UI 49/49, and packaged E2E 9/9. Commit c721883. Confidence: the watcher/re-sort mechanism and negative pre-fix result are deterministic; the earlier black screenshots were unrelated capture artifacts and are not evidence for this defect."
  campaign = "A power-user Finder replacement people trust and switch to"
  issue = 0

