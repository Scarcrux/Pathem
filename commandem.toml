  title = "Live-app fixes: icon-mode zoom keys dead after a mode switch (focus), and the hidden-files eye could not hide"
  status = "done"
  note = "Two reports. (1) Cmd+= zoom-in did nothing in icon mode. Direct keyDown to the grid zoomed fine for =, + and -, so the key path was intact; the REAL dispatch (NSApp.sendEvent) reproduced it: after switching to icons with nothing focused (fresh window / after clicking chrome), the first responder was the bare NSWindow, so no content shortcut reached the grid until the user clicked into it. Mechanism: setViewMode handed focus to the new content only if the OLD content was first responder (hadFocus). Fix: also focus the new content when nothing was focused (window is first responder) or focus sat on this pane's own header controls; never steals from a text field or the other pane. Harness proves both flows (list-focused switch, nothing-focused switch) now zoom via real dispatch. (2) The eye did nothing: the user's prefs have showHiddenByDefault=true and visibility was showHidden || default, an OR that can never turn off, so the per-folder toggle was inert and the glyph always read shown. Fix: ViewFormat.hiddenOverride (Bool?, nil = follow default; backward-compatible decode), the eye sets it to !effective and it wins; applying a style clears it. Harness proves show/hide both ways with the default on (2->1->2) and off (1->2->1) with the glyph tracking. Negative result: ExternalCommandTests (real-process output streaming) failed once in one full run, then passed 6/6 reruns; a timing flake under parallel load, unrelated, left recorded not hidden. UI harness 39/39, smoke PASS, real prefs untouched, no debug hooks in the release binary."
  campaign = "A power-user Finder replacement people trust and switch to"
  issue = 0

[[mission]]
  id = "m-2a077cd4"
  title = "Live-app fix: Cmd+numpad-plus now zooms in"
  status = "done"
  note = "Trigger: Cmd+plus on the numeric keypad still did not zoom in, while keypad minus worked. Evidence: AppKit reports the dedicated keypad + as charactersIgnoringModifiers=\"+\" with shift=false; KeyChord.from only folded shiftedSymbols when shift=true, producing the unbound canonical chord \"cmd++\" while the keymap binds \"cmd+=\" to view.zoomIn. Mechanism: punctuation normalization was incorrectly coupled to modifier state instead of the delivered character. Change: always fold mapped punctuation when the key is not a named special key; added foldsNumpadPunctuationWithoutShift to assert both canonicalization and command lookup. Effect: Cmd+numpad-plus resolves to view.zoomIn. Verification: xcrun swift test passed all 607 tests in 121 suites. A prior plain swift test did not reach tests because PATH selected standalone Swift 6.1.2 against the Xcode 27 SDK; rerunning with Xcode's matched Swift 6.4 passed. Confidence: unit path proven; physical-key behavior is based on the reported AppKit event fields."
  campaign = "A power-user Finder replacement people trust and switch to"
  issue = 0

[[mission]]
  id = "m-aa7a49eb"
  title = "Close the E2E audit gaps: magnet download, full product gate, and release probe"
  status = "done"
  note = "Trigger: an audit asked whether every feature, especially magnet links, had end-to-end coverage. Evidence: magnet tests stopped at parsing/BEP 9 units; daemon smoke only added a .torrent; Gate A and smoke were the only product scenarios in CI; packaged E2E relied on DEBUG hooks stripped from release; opt-in network tests returned early and appeared to pass. Mechanism: test layers existed but were disconnected, and the release harness assumed instrumentation it could not contain. Change: a hermetic tracker + real TCP BEP 9 peer resolves a magnet, downloads pieces, and verifies bytes; magnet promotion now keeps discovered peers; app/daemon smoke adds both .torrent and magnet forms; all deterministic scenarios plus an external signed-release probe run in make ci and CI; live tests are visibly disabled; TEST_MATRIX names hardware/public-network boundaries. Verification: final make ci passed localization, build, 9 XCTest + 742 Swift Testing cases, debug E2E 10/10 (including 39/39 UI), and packaged E2E 8/8 mandatory checks; its Accessibility window check honestly skipped for missing terminal permission. Negative results retained: two initial consolidated runs hit stale Swift 6.1 dependency-manifest cache state; absolute-path Xcode Swift fixed it. The first corrected commit hook then exposed a separate isolation bug: inherited GIT_INDEX_FILE made integration fixtures mutate the parent index and delete the worktree. The worktree was restored from Git, git subprocesses now strip only repository-routing env vars, fixture commits disable inherited hooks, and a simulated hook environment passed all 6 Git integration tests. Confidence: hermetic and package paths proven locally; public DHT/router/physical-device/third-party interoperability remain explicitly opt-in or manual."
  campaign = "A power-user Finder replacement people trust and switch to"
  issue = 0

[[mission]]
  id = "m-7914b8f6"
  title = "Expand product E2E across every deterministic audit gap"
  status = "done"
  note = "Trigger: the user asked to close every deterministic gap after the audit showed several feature families stopped at engine tests. Evidence: TEST_MATRIX had no product scenario for archive/disk utilities, search/metadata, Git/developer tools, file-operation history/conflicts, or torrent lifecycle persistence; remote providers had no hermetic product round-trip. Mechanism: the built executable's E2E dispatcher covered create/rename, UI interactions, and add-only torrent IPC, leaving cross-module and subprocess seams unexercised. Change: added mandatory real-I/O product scenarios for verified replace-copy, keep-both move, undo/redo, Trash/Put Back; ZIP create/list/extract/repack, split/merge, backup, secure delete and encrypted DMG; literal/regex search+replace, tags/comments/hashes; Git init/status/stage/diff/commit and external commands; app-provider-curl WebDAV CRUD against a loopback fixture; and torrent pause/limits/remove/restart/restore/resume. All scenarios use disposable config state. Findings fixed: macOS grep fallback now uses -E for documented extended regex; paused torrents now restore as paused rather than stopped, each with a focused integration test. Effect: make e2e expanded from 10 to 15 passing gates; final make ci passed localization/build, 9 XCTest + 744 Swift Testing cases in 155 suites, debug E2E 15/15, and packaged E2E 8/8 mandatory checks. The packaged Accessibility assertion honestly skipped without permission. Confidence: every deterministic local feature family has a product-boundary gate; physical devices, public DHT/router behavior, user-owned S3/Azure/FTP/SFTP services, OS permission sheets, Spotlight timing, and third-party interoperability remain explicitly environmental/manual."
  campaign = "A power-user Finder replacement people trust and switch to"
  issue = 0

[[mission]]
  id = "m-29843d0a"
  title = "Deepen deterministic E2E with object storage and negative paths"
  status = "done"
  note = "Trigger: the user asked to keep expanding deterministic product coverage beyond the first audit. Evidence: S3/Azure had only parser/signer tests; advanced filesystem tools, archive variants, torrent file/detail commands, and multiple negative paths stopped below the executable boundary. Mechanism found: both object providers used curl -T /dev/null for trailing-slash folder markers, so curl appended the local basename and created an object named null; Azure also ignored explicit custom endpoint ports. Change: added strict hermetic HTTPS S3/Azure CRUD fixtures that cryptographically verify SigV4/Shared Key and reject bad secrets; fixed zero-byte marker PUTs and Azure endpoint ports; added product checks for batch create/rename, links, duplicates, size/symlink behavior, two-way sync, bulk attributes, 7-Zip/cross-folder archives, cancellation/error preservation, WebDAV 404s, and torrent invalid magnet/files/details/selection. Effect: make ci passes 9 XCTest + 746 Swift Testing tests, 17/17 debug E2E scenarios, and 8 mandatory release-package checks (Accessibility probe honestly skipped without permission). Confidence: deterministic local and loopback claims are proven; physical devices, public services/networks, permission dialogs, and third-party interoperability remain explicitly environmental."
